name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sqlite

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build the ziran launcher
        run: |
          git clone --depth 1 https://github.com/ziranlang/ziran.git ziran
          make -C ziran
          echo "$PWD/ziran/build/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: sqlite
        run: |
          ziran fetch --locked
          make check
